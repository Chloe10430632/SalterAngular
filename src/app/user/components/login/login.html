<div
  class="fixed inset-0 z-40 bg-gradient-to-br from-cyan-100 via-blue-50 to-white w-screen h-screen overflow-hidden pt-16 lg:pt-[76px]">

  <div class="h-full w-full grid grid-cols-1 lg:grid-cols-12 p-4 lg:p-10 lg:gap-x-4 items-center justify-items-center">

    <div class="hidden lg:flex lg:col-span-6 lg:col-start-2 h-full relative items-center justify-center">
      <div class="z-10 text-center flex flex-col items-center">

        <div class="relative w-[640px] h-[640px] max-w-full">
          <div class="absolute inset-0 bg-primary/20 blur-[100px] rounded-full animate-pulse scale-150"></div>

          <div
            class="carousel w-full h-full relative z-10 rounded-[3.5rem] shadow-2xl border-8 border-white overflow-hidden">
            <div [class.hidden]="currentSlide !== 1" class="carousel-item relative w-full h-full">
              <img src="user/p1.jpg" class="w-full h-full object-cover" />
              <div class="absolute flex justify-between transform -translate-y-1/2 left-5 right-5 top-1/2 z-20">
                <button type="button" (click)="currentSlide = 5"
                  class="btn btn-circle btn-md bg-white/40 border-none hover:bg-white/60">❮</button>
                <button type="button" (click)="currentSlide = 2"
                  class="btn btn-circle btn-md bg-white/40 border-none hover:bg-white/60">❯</button>
              </div>
            </div>


            <div [class.hidden]="currentSlide !== 2" class="carousel-item relative w-full h-full">
              <img src="user/post.jpg" class="w-full h-full object-cover" />
              <div class="absolute flex justify-between transform -translate-y-1/2 left-5 right-5 top-1/2 z-20">
                <button type="button" (click)="currentSlide = 1"
                  class="btn btn-circle btn-md bg-white/40 border-none hover:bg-white/60">❮</button>
                <button type="button" (click)="currentSlide = 3"
                  class="btn btn-circle btn-md bg-white/40 border-none hover:bg-white/60">❯</button>
              </div>
            </div>

            <div [class.hidden]="currentSlide !== 3" class="carousel-item relative w-full h-full">
              <img src="user/trip.jpg" class="w-full h-full object-cover" />
              <div class="absolute flex justify-between transform -translate-y-1/2 left-5 right-5 top-1/2 z-20">
                <button type="button" (click)="currentSlide = 2"
                  class="btn btn-circle btn-md bg-white/40 border-none hover:bg-white/60">❮</button>
                <button type="button" (click)="currentSlide = 4"
                  class="btn btn-circle btn-md bg-white/40 border-none hover:bg-white/60">❯</button>
              </div>
            </div>

            <div [class.hidden]="currentSlide !== 4" class="carousel-item relative w-full h-full">
              <img src="user/coach.jpg" class="w-full h-full object-cover" />
              <div class="absolute flex justify-between transform -translate-y-1/2 left-5 right-5 top-1/2 z-20">
                <button type="button" (click)="currentSlide = 3"
                  class="btn btn-circle btn-md bg-white/40 border-none hover:bg-white/60">❮</button>
                <button type="button" (click)="currentSlide = 5"
                  class="btn btn-circle btn-md bg-white/40 border-none hover:bg-white/60">❯</button>
              </div>
            </div>

            <div [class.hidden]="currentSlide !== 5" class="carousel-item relative w-full h-full">
              <img src="user/house.jpg" class="w-full h-full object-cover" />
              <div class="absolute flex justify-between transform -translate-y-1/2 left-5 right-5 top-1/2 z-20">
                <button type="button" (click)="currentSlide = 4"
                  class="btn btn-circle btn-md bg-white/40 border-none hover:bg-white/60">❮</button>
                <button type="button" (click)="currentSlide = 1"
                  class="btn btn-circle btn-md bg-white/40 border-none hover:bg-white/60">❯</button>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <div class="lg:col-span-4 lg:col-start-8 h-full flex items-center justify-center relative lg:-ml-80">
      <div
        class="bg-white/90 backdrop-blur-xl w-full max-w-sm h-[640px] p-8 lg:p-10 rounded-[3.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.08)] border border-white relative z-20 flex flex-col justify-between">

        <div class="text-center pt-2">
          <img src="salter-logo.svg" alt="Salter Logo" class="w-40 mb-4 mx-auto">
          <h3 class="text-2xl font-black text-slate-800 uppercase tracking-tight">Login</h3>
        </div>

        <div class="flex-grow flex flex-col justify-center">
          <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-4">
            <div class="form-control w-full">
              <label class="label py-1 px-1">
                <span class="label-text font-black text-[10px] uppercase text-slate-400 tracking-widest">Email
                  Address</span>
              </label>
              <input type="email" formControlName="email"
                class="input input-bordered w-full h-12 bg-slate-50 border-none rounded-2xl font-bold"
                placeholder="OOOOO@gmail.com" />
            </div>

            <div class="form-control w-full">
              <label class="label py-1 px-1 flex justify-between">
                <span class="label-text font-black text-[10px] uppercase text-slate-400 tracking-widest">Password</span>
              </label>
              <div class="relative w-full">
                <input [type]="isPasswordVisible ? 'text' : 'password'" formControlName="password"
                  class="input input-bordered w-full h-12 pr-12 bg-slate-50 border-none rounded-2xl font-bold"
                  placeholder="••••••••" />

                <button type="button" (click)="togglePasswordVisibility()"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors">
                  <i class="bi" [class.bi-eye]="!isPasswordVisible" [class.bi-eye-slash]="isPasswordVisible"></i>
                </button>
              </div>
            </div>

            <div class="pt-2">
              <button type="submit" [disabled]="isLoading"
                class="btn btn-primary w-full h-14 rounded-2xl font-black text-lg tracking-widest border-none shadow-lg">
                Login
              </button>
            </div>

            <div class="divider text-[10px] text-slate-300 font-bold uppercase tracking-[0.3em] py-2">Social Access
            </div>

            <button type="button" (click)="signInWithGoogle()"
              class="btn btn-ghost bg-slate-50 text-slate-500 w-full h-12 rounded-2xl font-bold">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-3">
              Sign in with Google
            </button>
          </form>
        </div>

        <p class="text-center mt-4 text-sm text-slate-400 font-bold">
          New here? <a routerLink="/register" class="text-primary hover:underline ml-1">Join the tribe</a>
        </p>
      </div>
    </div>

  </div>

</div>
