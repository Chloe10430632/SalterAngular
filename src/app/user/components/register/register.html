<div class="min-h-screen bg-base-200 flex items-center justify-center py-10">
  <div class="card w-full max-w-2xl bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl font-bold mb-6">會員註冊</h2>

      <ul class="steps w-full mb-8">
        <li class="step" [class.step-primary]="step >= 1">上傳頭像</li>
        <li class="step" [class.step-primary]="step >= 2">基本資料</li>
        <li class="step" [class.step-primary]="step >= 3">信箱驗證</li>
      </ul>

      <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

        @if (step === 1) {
        <div class="flex flex-col items-center gap-4">
          <div class="avatar">
            <div class="w-24 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2 mb-5">
              <img class="object-cover object-top" [src]="previewUrl || '/user/default-avatar.png'" />
            </div>
          </div>

          <input type="file" class="file-input file-input-bordered w-full max-w-xs" (change)="onFileSelected($event)"
            accept="image/*" />

          <div class="card-actions justify-end w-full mt-6">
            <button type="button" class="btn btn-primary" [disabled]="!isPictureUploaded"
              (click)="nextStep()">下一步</button>
          </div>
        </div>
        }

        @if (step === 2) {
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="form-control">
            <label class="label"><span class="label-text">電子郵件</span></label>
            <input type="email" formControlName="email" class="input input-bordered" placeholder="example@mail.com" />
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">使用者名稱</span></label>
            <input type="text" formControlName="userName" class="input input-bordered" />
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">密碼</span></label>
            <div class="relative w-full">
              <input [type]="isPasswordVisible ? 'text' : 'password'" formControlName="password"
                class="input input-bordered w-full pr-12" placeholder="請輸入密碼" />

              <button type="button"
                class="absolute inset-y-0 right-0 flex items-center px-4 text-gray-500 hover:text-primary transition-colors"
                (click)="isPasswordVisible = !isPasswordVisible">
                <i [class]="isPasswordVisible ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
              </button>
            </div>
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">確認密碼</span></label>
            <div class="relative w-full">
              <input [type]="isConfirmPasswordVisible ? 'text' : 'password'" formControlName="confirmPassword"
                class="input input-bordered w-full pr-12" placeholder="請再次輸入密碼" />

              <button type="button"
                class="absolute inset-y-0 right-0 flex items-center px-4 text-gray-500 hover:text-primary transition-colors"
                (click)="isConfirmPasswordVisible = !isConfirmPasswordVisible">
                <i [class]="isConfirmPasswordVisible ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
              </button>
            </div>
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">電話</span></label>
            <input type="text" formControlName="phone" class="input input-bordered" />
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">性別</span></label>
            <select formControlName="gender" class="select select-bordered">
              <option value="">請選擇</option>
              <option value="Male">男</option>
              <option value="Female">女</option>
            </select>
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">生日</span></label>
            <input type="date" formControlName="birthday" class="input input-bordered" />
          </div>
        </div>

        <div class="card-actions justify-between mt-8">
          <button type="button" class="btn btn-ghost" [disabled]="isLoading" (click)="step = 1">上一步</button>

          <button type="submit" class="btn btn-primary" [disabled]="!isStep2Valid || isLoading">
            @if (isLoading) {
            <span class="loading loading-spinner"></span>
            正在發送...
            } @else {
            發送驗證碼
            }
          </button>
        </div>
        }
        @if (step === 3) {
        <div class="flex flex-col items-center gap-6">
          <div class="text-center">
            <h3 class="text-lg font-semibold">驗證碼已寄送到您的信箱</h3>
            <div class="text-sm text-gray-500 mt-2">
              @if (!canResend) {
              驗證碼有效時間：<span class="font-mono text-primary text-xl">{{ formatTime }}</span>
              } @else {
              <span class="text-error">驗證碼已過期，請重新獲取</span>
              }
            </div>
          </div>

          <div class="form-control w-full max-w-xs">
            <input type="text" formControlName="otp" placeholder="請輸入 6 位數"
              class="input input-bordered text-center text-2xl tracking-widest" maxlength="6" />
          </div>

          <div class="w-full max-w-xs flex flex-col gap-3">
            <button type="button" class="btn btn-secondary w-full"
              [disabled]="registerForm.get('otp')?.invalid || canResend" (click)="onVerifyOtp()">
              驗證並啟用帳號
            </button>

            @if (canResend) {
            <button type="button" class="btn btn-outline btn-ghost w-full mt-2" (click)="onResendOtp()">
              沒收到信？重新發送驗證碼
            </button>
            }
          </div>
        </div>
        }

      </form>
    </div>
  </div>
</div>
