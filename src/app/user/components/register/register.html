<div class="min-h-screen bg-base-200 flex flex-center py-10">
  <div class="card w-full max-w-2xl bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl font-bold mb-6">會員註冊</h2>

      <ul class="steps w-full mb-8">
        <li class="step" [class.step-primary]="step >= 1">上傳頭像</li>
        <li class="step" [class.step-primary]="step >= 2">基本資料</li>
      </ul>

      <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

        @if (step === 1) {
        <div class="flex flex-col items-center gap-4">
          <div class="avatar">
            <div class="w-24 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
              <img [src]="previewUrl || 'assets/default-avatar.png'" />
            </div>
          </div>

          <input type="file" class="file-input file-input-bordered w-full max-w-xs" (change)="onFileSelected($event)"
            accept="image/*" />

          <div class="card-actions justify-end w-full mt-6">
            <button type="button" class="btn btn-primary" [disabled]="!isPictureUploaded"
              (click)="step = 2">下一步</button>
          </div>
        </div>
        }

        @if (step === 2) {
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="form-control">
            <label class="label"><span class="label-text">電子郵件</span></label>
            <input type="email" formControlName="email" class="input input-bordered" placeholder="example@mail.com" />
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">使用者名稱</span></label>
            <input type="text" formControlName="userName" class="input input-bordered" />
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">密碼</span></label>
            <input type="password" formControlName="password" class="input input-bordered" />
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">確認密碼</span></label>
            <input type="password" formControlName="confirmPassword" class="input input-bordered" />
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">電話</span></label>
            <input type="text" formControlName="phone" class="input input-bordered" />
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">性別</span></label>
            <select formControlName="gender" class="select select-bordered">
              <option value="">請選擇</option>
              <option value="Male">男</option>
              <option value="Female">女</option>
              <option value="Other">其他</option>
            </select>
          </div>

          <div class="form-control md:col-span-2">
            <label class="label"><span class="label-text">生日</span></label>
            <input type="date" formControlName="birthday" class="input input-bordered" />
          </div>
        </div>

        <div class="card-actions justify-between mt-8">
          <button type="button" class="btn btn-ghost" (click)="step = 1">上一步</button>
          <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid">完成註冊</button>
        </div>
        }

      </form>
    </div>
  </div>
</div>
