<div data-theme="bumblebee" class="min-h-screen bg-base-100">

  <div class="hero min-h-[300px]"
    style="background-image: url(https://res.cloudinary.com/dnqawxc59/image/upload/v1774451358/background_vn7rxo.png);">
    <div class="hero-overlay bg-opacity-40"></div>
    <div class="hero-content text-center text-neutral-content">
      <div class="max-w-2xl">
        <h1 class="mb-5 text-5xl font-bold leading-tight drop-shadow-lg">
          尋找專業教練 <br />
        </h1>
        <p class="mb-8 text-lg font-bold opacity-90">探索全台最頂尖的水域運動教練，開啟你的海洋冒險。</p>

        <div class="form-control w-full max-w-md mx-auto">
          <div class="relative">
            <input type="text" placeholder="輸入運動項目或教練姓名..."
              class="input input-bordered input-lg w-full pr-16 text-base-content focus:input-primary" />
            <button class="btn btn-primary btn-lg absolute top-0 right-0 rounded-l-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              搜尋
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container mx-auto px-4 py-10">
    <div class="flex flex-col w-full items-center">

      <div role="tablist" class="tabs tabs-lifted tabs-lg w-full max-w-6xl">

        <input type="radio" name="coach_tabs" role="tab" class="tab font-bold text-lg" aria-label="-- 熱門推薦 --"
          checked />
        <div role="tabpanel" class="tab-content bg-base-100 border-base-300 rounded-box p-10">
          <!-- 熱門迴圈 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-24 pt-20 place-items-center">
            @for (item of coaches; track item.coachId) {
            <app-fav-card [item]="item" [isFav]="myFavIds().includes(item.coachId)"
              [courseName]="allCourseMap[item.coachId] || '載入中...'" (removeMe)="handleRemove($event)">
            </app-fav-card>
            }@empty {
            <div class="col-span-full flex flex-col items-center py-10 text-base-content/50">
              <span class="loading loading-spinner loading-lg text-primary"></span>
              <p class="mt-4 font-bold">教練正在游過來，請稍候...</p>
            </div>
            }
          </div>

          @if (coaches.length > 0 && hasMorePages) {
          <div class="flex justify-center mt-20">
            <button (click)="LoadMore()"
              class="btn btn-primary btn-outline btn-wide shadow-md hover:scale-105 transition-all">
              看更多熱門教練
            </button>
          </div>
          }@else{
          <div class="flex justify-center mt-20">
            <p class="text-base-content/50 font-bold">其他教練還在海裡</p>
          </div>}

          <input type="radio" name="coach_tabs" role="tab" class="tab font-bold text-lg" aria-label="-- 最新入駐--" />
          <div role="tabpanel" class="tab-content bg-base-100 border-base-300 rounded-box p-10">
            <!-- 最新迴圈 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-24 pt-20 place-items-center">
              @for (item of latestC; track item.coachId) {
              <app-fav-card [item]="item" [courseName]="allCourseMap[item.coachId] || '載入中...'">
              </app-fav-card>
              } @empty {
              <div class="col-span-full text-center py-10 text-base-content/50">
                目前還沒有新教練入駐喔！
              </div>
              }
            </div>
          </div>

        </div>
      </div>
    </div>

    <app-little-island></app-little-island>
    <app-footer></app-footer>

  </div>
