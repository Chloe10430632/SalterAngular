<div data-theme="bumblebee"
  class="card bg-base-100 shadow-2xl overflow-hidden border border-base-300 max-w-5xl mx-auto">
  <div class="flex flex-col lg:flex-row">

    <!-- 月曆：監聽 dateSelected，傳入 markedDates -->
    <app-calender [markedDates]="[]" (dateSelected)="dateSelected($event)">
    </app-calender>

    <!-- 右側課程列表 -->
    <div class="flex-1 p-6 space-y-4 bg-base-100">
      <div class="flex justify-between items-center border-b border-base-200 pb-4">
        <div class="flex items-center gap-3">
          <span class="text-3xl font-black text-primary/30">{{ selectDate }}</span>
          <h3 class="text-xl font-bold">當日上架課程</h3>
        </div>
        <span class="text-xs badge badge-ghost uppercase tracking-widest">Schedule</span>
      </div>

      <div class="space-y-3">
        @for (course of dailyCourses; track course.sessionId) {
        <app-course-publish [data]="course" (remove)="onRemoveCourse($event)">
        </app-course-publish>
        } @empty {
        <div class="py-20 text-center">
          <p class="text-base-content/40 italic">本日目前沒有排定課程</p>
        </div>
        }
      </div>
    </div>
  </div>

  @if(isLoggedIn()){
  <app-little-island></app-little-island>
  }
  <app-footer></app-footer>
