<div class="flex justify-center w-full p-5 mt-5" data-theme="bumblebee">

  <div class="flex flex-col w-full max-w-[1008px]">
    <!-- 搜尋 & 按鈕 -->
    <div class="flex justify-between items-start mb-3 mt-2 w-full px-1">
      <div class="flex items-start gap-4"> <app-search (searchEvent)="indexSearch($event)" class=" mt-0"></app-search>

        <div class="flex gap-2">
          <app-btn-rank-pop (click)="handleRankUpdate()"></app-btn-rank-pop>
          <app-btn-rank-new (rankUpdated)="handleNewRank($event)"></app-btn-rank-new>
        </div>
      </div>

      <div class="h-[3rem] flex items-center">
        <app-btn-coach-switch class="h-[3rem]">


        </app-btn-coach-switch>
      </div>
    </div>
    <!-- end -->
    <!-- 卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 justify-items-center">
      @for(c of coaches; track c.CoachId ){
      <app-coach-card [coachData]="c"></app-coach-card>
      }
      @if (isLoading) {
      @for (i of [1,2,3,4,5,6]; track i) {
      <div class="card bg-base-100 w-80 h-[480px] shadow-sm border border-base-200 p-4 flex flex-col gap-4">
        <div class="skeleton h-48 w-full rounded-xl"></div>
        <div class="skeleton h-6 w-3/4"></div>
        <div class="flex gap-2">
          <div class="skeleton h-4 w-12"></div>
          <div class="skeleton h-4 w-12"></div>
        </div>
        <div class="skeleton h-4 w-full mt-4"></div>
        <div class="skeleton h-4 w-full"></div>
        <div class="skeleton h-10 w-full mt-auto"></div>
      </div>
      }}
    </div>
    @if(!isLoading && coaches.length === 0){
    <div class="text-center py-20 text-base-content/50">教練還在海裡</div>
    }
    @if (!isEnd){
    <div class="flex justify-center my-10">
      <button class="btn btn-primary" [disabled]="isLoading" (click)="getPopRank()">
        @if (isLoading) { <span class="loading loading-spinner"></span> }
        {{ isLoading ? '搜尋中...' : '載入更多教練' }}
      </button>
    </div>}
    @if(isEnd){
    <div class="text-center py-20" style="color: gray;">...其他教練還在海裡...
    </div>}
  </div>
  <!-- end -->
</div>

<div>
  <app-footer></app-footer>
</div>
