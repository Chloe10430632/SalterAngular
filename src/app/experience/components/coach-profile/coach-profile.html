<div class="flex flex-col items-center w-full min-h-screen bg-base-100" data-theme="bumblebee">



  <div data-theme="bumblebee" class="min-h-screen bg-base-200 p-4">
    @if (isLoading) {
    <div class="flex justify-center p-10">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
    } @else if (coachData) {
    <app-coach-pf [data]="coachData"></app-coach-pf>
    } @else {
    <div class="alert alert-error">找不到教練資料...</div>
    }
  </div>

  <app-little-island></app-little-island>
  <app-footer></app-footer>
