<div class="flex flex-col items-center w-full min-h-screen bg-base-100" data-theme="bumblebee">

  <div class="justify-between mt-8">
    <app-toptab></app-toptab>
  </div>
  @if (isLoading) {
  <div class="flex justify-center py-20">
    <span class="loading loading-dots loading-lg text-primary"></span>
  </div>
  }

  @else if (coachData) {
  <app-coach-pf [data]="coachData"></app-coach-pf>}
  @else {
  <div class="alert alert-error shadow-lg">
    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>抱歉，我們暫時無法取得教練資料。</span>
  </div>
  }
</div>
