<!-- //========!!這是 父Component!!================//
//========!!檢視自己的資訊!!================// -->

<app-noavatar title="我的教練資料">
  <div data-theme="bumblebee" class="min-h-screen bg-base-100 flex flex-col items-center w-full">


    <div class="flex flex-col items-center w-full p-4 md:p-8">

      <app-toptab class="flex justify-center w-full mb-8"></app-toptab>

      <div class="w-full bg-base-100 p-0 flex-grow rounded-lg">
        @if (isLoading) {
        <div class="flex justify-center p-20">
          <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>
        } @else if (coachData) {
        <app-coach-pf [data]="coachData.data"></app-coach-pf>
        } @else {
        <div class="alert alert-error shadow-lg max-w-2xl mx-auto">
          <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>找不到教練資料...</span>
        </div>
        }
      </div>

    </div>


  </div>
</app-noavatar>



<app-little-island></app-little-island>
<app-footer></app-footer>
