<div class="w-full bg-base-100 rounded-[2.5rem] shadow-sm p-10 mb-8">

  <div class="flex flex-col md:flex-row items-start gap-6 md:gap-10">

    <div class="avatar shrink-0">
      <div class="w-32 h-32 md:w-40 md:h-40 rounded-full ring ring-primary ring-offset-base-100 ring-offset-4">
        @if (coachData()) {
        <img [src]="coachData()?.avatarUrl |avatar" alt="Avatar" />
        } @else {
        <img [src]="null | avatar" alt="Default Avatar" />
        }
      </div>
    </div>

    <div class="hidden md:flex flex-col flex-1 h-40">

      <div class="flex-1 flex items-start">
        <h2 class="text-3xl font-bold text-[#8B4513] mt-6">
          {{ title }}
        </h2>
      </div>

      <div class="w-full h-[3px] bg-neutral-300"></div>

      <div class="flex-1 flex items-center justify-center">
        <app-toptab class="w-auto"></app-toptab>
      </div>

    </div>

    <div class="block md:hidden w-full text-center">
      <h2 class="text-2xl font-bold text-[#8B4513] mb-1">{{ title }}</h2>
      <div class="h-[2px] bg-neutral-300 my-4"></div>
      <app-toptab></app-toptab>
    </div>

  </div>

  <div class="px-2 md:px-4 mt-8">
    <ng-content></ng-content>
  </div>
</div>
