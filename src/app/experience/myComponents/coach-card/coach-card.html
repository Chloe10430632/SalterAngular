<div class="card bg-base-100 w-80 h-[480px] shadow-xl border border-base-200 flex flex-col" data-theme="bumblebee">

  <figure class="px-4 pt-4 h-48 flex-shrink-0">
    <img [src]="coachData.avatarUrl || '/assets/default-avatar.png'" [alt]="coachData.coachName"
      class="rounded-xl h-48 w-full object-cover" />
  </figure>

  <div class="card-body flex-grow flex flex-col justify-between">

    <div class="flex justify-between items-start">
      <h2 class="card-title text-primary">
        {{ coachData.coachName }}
      </h2>
      <label class="btn btn-ghost btn-circle swap swap-rotate">
        <input type="checkbox" />

        <svg xmlns="http://www.w3.org/2000/svg" class="swap-on h-6 w-6 fill-current text-error" viewBox="0 0 24 24">
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
        </svg>

        <svg xmlns="http://www.w3.org/2000/svg" class="swap-off h-6 w-6 fill-current text-base-content/40" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
        </svg>
      </label>
    </div>

    <div class="flex flex-wrap gap-1 ">
      @for (area of coachData.district; track area) {
      <div class="badge badge-ghost badge-sm 10pt">{{ area }}</div>
      }
    </div>

    <div class="flex items-center gap-2 mt-2">
      <div class="rating rating-xs">
        <div class="mask mask-star-2 bg-orange-400 w-3 h-3"></div>
      </div>
      <span class="text-sm font-bold">{{ coachData.avgRating }}</span>
      <span class="text-xs text-base-content/60">({{ coachData.reviewCount }} 則評論)</span>
    </div>

    <div class="card-actions justify-start mt-3">
      @for (spec of coachData.specialities; track spec) {
      <div class="badge badge-outline badge-info">{{ spec }}</div>
      }
    </div>

    <div class="card-actions justify-end mt-4">
      <button class="btn btn-primary btn-sm">查看教練檔案</button>
    </div>
  </div>
</div>
