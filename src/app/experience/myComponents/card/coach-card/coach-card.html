 <aside class="lg:col-span-1">
      <div class="card bg-base-100 shadow-xl sticky top-8">
        <figure class="px-10 pt-10">
          <div class="avatar">
            <div class="w-32 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
              <img src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.webp" alt="教練頭像" />
            </div>
          </div>
        </figure>

        <div class="card-body items-center text-center p-6">
          <div class="flex items-center justify-center gap-2">
            <h2 class="card-title text-xl font-bold text-base-content">Daisy 老師</h2>

            <label class="swap swap-rotate hover:scale-110 transition-transform cursor-pointer">
              <input type="checkbox" (change)="toggleFavorite()" [checked]="isFavorite" />
              <svg xmlns="http://www.w3.org/2000/svg" class="swap-on fill-error w-7 h-7" viewBox="0 0 24 24">
                <path
                  d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
              </svg>
              <svg xmlns="http://www.w3.org/2000/svg" class="swap-off fill-base-content/30 w-7 h-7" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
              </svg>
            </label>
          </div>

          <div class="flex items-center gap-2 mt-2">
            <div class="flex items-center text-warning font-bold">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 fill-current" viewBox="0 0 20 20">
                <path
                  d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
              </svg>
              <span class="ml-1 text-lg">{{ averageRating }}</span>
            </div>
            <div class="divider divider-horizontal mx-0"></div>
            <div class="text-base-content/60 text-sm">
              <span class="font-semibold text-base-content">{{ totalReviews }}</span> 則評論
            </div>
          </div>

          <p class="mt-4 text-sm text-base-content/70">
            專注於幫助學生找回自信與健康的身體。擁有 10 年教學經驗，擅長客製化課程設計。
          </p>

          <div class="divider">專業細節</div>
          <div class="w-full text-left space-y-2">
            <div class="flex items-center gap-2">
              <span class="font-bold">專業：</span> 瑜珈、重訓、飲食規劃
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold">地區：</span> 台北市 / 遠端教學
            </div>
          </div>

          <!-- <div class="card-actions mt-6 w-full">
            <button class="btn btn-primary btn-block">聯繫我</button>
          </div> -->
        </div>
      </div>
    </aside>
