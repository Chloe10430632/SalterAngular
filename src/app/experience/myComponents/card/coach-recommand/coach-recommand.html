@if (isVisible && coaches.length > 0) {
<div class="toast toast-start z-50" data-theme="bumblebee">
  <div class="alert shadow-lg bg-base-100 border-2 border-primary p-4 w-80">
    <div class="flex flex-col gap-2 w-full">
      <div class="flex justify-between items-center">
        <span class="text-sm font-bold text-primary"> 你可能會喜歡</span>
        <button (click)="close()" class="btn btn-ghost btn-xs">✕</button>
      </div>

      <div class="flex items-center gap-4">
        <div class="avatar">
          <div class="w-16 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
            <img [src]="currentCoach.avatarUrl || 'assets/default-avatar.png'" />
          </div>
        </div>
        <div>
          <h3 class="font-bold">{{ currentCoach.coachName }}</h3>
          <div class="flex flex-wrap gap-1 mt-1">
            @for (tag of currentCoach.specialities; track tag) {
            <span class="badge badge-secondary badge-xs">{{ tag }}</span>
            }
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-2">
        <button class="btn btn-sm btn-ghost text-xs" (click)="nextCoach()">
          >>
        </button>
        <button (click)="coachIntro(currentCoach.coachId)" class="btn btn-sm btn-primary text-xs">
          查看介紹
        </button>
      </div>
    </div>
  </div>
</div>
}
