<input type="checkbox" id="review-modal" class="modal-toggle" />

<div class="modal" role="dialog">
  <div class="modal-box p-0 max-h-[70vh] flex flex-col overflow-hidden">

    <div class="p-4 border-b border-base-200 bg-base-100 sticky top-0 z-20">
      <h3 class="font-bold text-center">所有評論 ({{ reviews.length }})</h3>
    </div>

    <div class="overflow-y-auto grow scroll-smooth">
      @for (item of reviews; track item.reviewId) {
      <div class="border-b border-base-200 p-5 bg-base-100 last:border-0">

        <!-- 同一行：頭像 + 名字 + 星星 + 日期 -->
        <div class="flex items-center gap-3 mb-2">
          <div style="width:34px; height:34px; border-radius:50%; background:#FAEEDA; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; color:#633806; flex-shrink:0;">
            {{ (item.userName || '#')[0] }}
          </div>
          <span class="font-bold text-primary text-sm">
            {{ item.userName || '學員 #' + item.userId }}
          </span>
          <span class="badge badge-warning badge-sm">★ {{ item.rating }}</span>
          <span class="text-xs opacity-50 ml-auto">
            {{ item.reviewedAt | date:'yyyy-MM-dd' }}
          </span>
        </div>

        <!-- 評論內容 -->
        <p class="text-sm text-base-content/80 leading-relaxed pl-[46px]">
          {{ item.reviewContent }}
        </p>

      </div>
      } @empty {
      <div class="p-10 text-center opacity-50">暫時還沒有評論喔！</div>
      }
    </div>

    <div class="modal-action p-2 border-t border-base-200 bg-base-100">
      <label for="review-modal" class="btn btn-ghost btn-sm w-full">關閉</label>
    </div>
  </div>

  <label class="modal-backdrop" for="review-modal">Close</label>
</div>
