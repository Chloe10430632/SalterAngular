<div data-theme="bumblebee" class="min-h-screen  py-10 px-4">
  <div class="max-w-3xl mx-auto card bg-base-100 shadow-2xl border border-base-300">
    <div class="card-body p-8 md:p-12">

      <div class="mb-10 text-center">
        <h2 class="text-3xl font-extrabold text-primary mb-2">教練資料設定</h2>
        <div class="divider w-24 mx-auto divider-primary"></div>
      </div>

      <form class="space-y-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-end">
          <div class="form-control">
            <label class="label pb-2">
              <span class="label-text font-bold text-lg">姓名 <span class="text-error">*</span></span>
            </label>
            <input type="text" placeholder="請輸入姓名" class="input input-bordered input-primary w-full" />
          </div>

          <div class="form-control">
            <label class="label pb-2">
              <span class="label-text font-bold text-lg">個人頭像</span>
            </label>
            <div class="flex items-center gap-4">
              <div class="avatar">
                <div class="w-16 h-16 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
                  <img src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.webp"
                    alt="Avatar Preview" />
                </div>
              </div>
              <input type="file" class="file-input file-input-bordered file-input-primary flex-1" />
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div class="form-control">
            <label class="label pb-2">
              <span class="label-text font-bold text-lg">服務縣市</span>
            </label>
            <select class="select select-bordered select-primary w-full">
              <option disabled selected>請選擇縣市</option>
              <option>台北市</option>
            </select>
          </div>
          <div class="form-control">
            <label class="label pb-2">
              <span class="label-text font-bold text-lg">服務區域</span>
            </label>
            <select class="select select-bordered select-primary w-full">
              <option disabled selected>請選擇行政區</option>
              <option>大安區</option>
            </select>
          </div>
        </div>

        <div class="form-control w-full">
          <label class="label pb-4">
            <span class="label-text font-bold text-lg text-primary">個人簡介</span>
          </label>
          <textarea class="textarea textarea-bordered textarea-primary h-40 text-base leading-relaxed mb-2 w-full"
            placeholder="請詳細描述您的教學風格..."></textarea>
          <label class="label pt-0">
            <span class="label-text-alt text-base-content/50 italic font-medium">
              💡 建議字數 100-300 字，包含您的專業證照與教學經歷以提升預約率。
            </span>
          </label>
        </div>

        <div class="divider pt-4"></div>

        <div class="card-actions justify-end gap-4">
          <button type="button" class="btn btn-ghost px-8">取消編輯</button>
          <button type="submit" class="btn btn-primary px-12 shadow-lg text-white">確認儲存</button>
        </div>
      </form>
    </div>
  </div>
</div>
