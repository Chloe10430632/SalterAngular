



<div data-theme="bumblebee" class="p-4">
  <div class="collapse collapse-arrow bg-base-100 border border-base-300 rounded-box shadow-sm mb-4">
    <input type="checkbox" class="peer" #toggle />

    <div class="collapse-title flex items-center gap-4 py-2 px-4 h-24">
      <div class="w-24 h-16 rounded-lg overflow-hidden peer-checked:hidden">
        <div class="carousel w-full h-full">
          <div [id]="'slide' + i" class="carousel-item w-full" *ngFor="let img of course.images; let i = index"
               [ngClass]="{'block': activeSlide === i, 'hidden': activeSlide !== i}">
            <img [src]="img" class="w-full h-full object-cover" />
          </div>
        </div>
      </div>

      <div class="flex-1">
        <h2 class="text-xl font-bold">{{ course.title }}</h2>
        <div class="flex gap-4 text-sm text-base-content/70">
          <span><i class="far fa-clock mr-1"></i>{{ course.timeSlot }}</span>
          <span class="text-secondary font-semibold">${{ course.price }}</span>
        </div>
      </div>
    </div>

    <div class="collapse-content bg-base-200/30">
      <div class="divider mt-0"></div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 p-2">
        <div class="md:col-span-1">
          <img [src]="course.images[0]" class="rounded-xl shadow-md w-full h-48 object-cover" alt="Course Cover" />
        </div>

        <div class="md:col-span-2 flex flex-col justify-between">
          <div>
            <p class="text-base-content/80 leading-relaxed mb-4">{{ course.description }}</p>
            <div class="flex flex-wrap gap-4 text-sm">
              <span class="badge badge-outline">
                人數：{{ course.enrolled }}/{{ course.capacity }} ({{ isFull ? '額滿' : '招募中' }})
              </span>
              <span class="text-base-content/60 italic">最新更新：{{ course.lastUpdated }}</span>
            </div>
          </div>

          <div class="card-actions justify-end mt-6">
            <button class="btn btn-primary btn-md shadow-lg" [disabled]="isFull">
              立即結帳
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
