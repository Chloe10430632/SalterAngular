<section>
  <!-- 上面標題 -->
  <div class="flex justify-between items-center mb-6">

    <h3 class="text-2xl font-bold flex items-center gap-2">

      <span class="w-2 h-8 bg-secondary rounded-full"></span> 開課中的課程

    </h3>

    <button class="btn btn-ghost btn-sm gap-2 text-secondary">

      看更多課程

      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">

        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />

      </svg>

    </button>

  </div>
  <!-- 上面標題 -->


  <div data-theme="bumblebee" class="p-4">
    <div class="collapse collapse-arrow bg-base-100 border border-base-300 rounded-box shadow-sm mb-4">
      <input type="checkbox" class="peer" #toggle />

      <div class="collapse-title flex items-center gap-4 py-2 px-4 h-24">

        <div class="w-24 h-16 rounded-lg overflow-hidden peer-checked:hidden">
          <div class="carousel w-full h-full relative">
            @for (img of course.images; track $index) {
            <div [id]="'slide' + $index" class="carousel-item w-full" [class.block]="activeSlide === $index"
              [class.hidden]="activeSlide !== $index">
              <img [src]="img" class="w-full h-full object-cover" />
            </div>
            }
          </div>
        </div>

        <div class="flex-1">
          <h2 class="text-xl font-bold">{{ course.title }}</h2>
          <div class="flex gap-4 text-sm text-base-content/70">
            <span>時段：{{ course.timeSlot }}</span>
            <span class="text-secondary font-bold">${{ course.price }}</span>
          </div>
        </div>
      </div>

      <div class="collapse-content bg-base-200/30">
        <div class="divider mt-0"></div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 p-2">

          <div class="md:col-span-1">
            <img [src]="course.images[activeSlide]" class="rounded-xl shadow-lg w-full h-48 object-cover" />
          </div>

          <div class="md:col-span-2 flex flex-col justify-between">
            <div>
              <p class="text-base-content/80 mb-4">{{ course.description }}</p>
              <div class="flex flex-wrap gap-3">
                <div class="badge badge-secondary gap-2">
                  人數：{{ course.enrolled }} / {{ course.capacity }}
                </div>
                @if (course.enrolled >= course.capacity) {
                <div class="badge badge-error text-white">額滿</div>
                } @else {
                <div class="badge badge-success text-white">招募中</div>
                }
                <span class="text-xs text-base-content/50 self-center">更新日期：{{ course.lastUpdated }}</span>
              </div>
            </div>

            <div class="card-actions justify-end mt-6">
              <button class="btn btn-primary" [disabled]="course.enrolled >= course.capacity">
                立即結帳
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>



</section>
