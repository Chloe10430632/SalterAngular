<div data-theme="bumblebee">
  @if (coachItem(); as c) {
  <div class="card w-64 min-h-[360px] bg-base-100 shadow-xl border border-base-300 relative mt-14  flex-shrink-0">

    <div class="absolute -top-14 left-1/2 -translate-x-1/2">
      <div class="avatar">
        <div class="w-28 h-28 rounded-full border-4 border-base-100 shadow-lg ring ring-primary ring-offset-2">
          <img [src]="c.avatarUrl | avatar" alt="教練頭像" class="bg-base-200" />
        </div>
      </div>
    </div>

    <div class="card-body items-center text-center pt-20 pb-6 px-4 flex flex-col gap-0 justify-start">

      <div class="flex items-center justify-center gap-1">
        <h2 class="card-title text-lg font-bold">{{ c.coachName }}</h2>
        <label class="swap swap-rotate cursor-pointer">
          <input type="checkbox" (click)="toggleFav($event)" [checked]="isFav()" />
          <svg xmlns="http://www.w3.org/2000/svg" class="swap-on fill-error w-5 h-5" viewBox="0 0 24 24">
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" class="swap-off fill-base-content/20 w-5 h-5" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
        </label>
      </div>

      <div class="mb-2">
        @if(c.district){
        <span class="text-[10px] text-base-content/40">{{ c.district }}</span>
        }
      </div>

      <div class="flex flex-wrap justify-center gap-1 mb-2">
        @for(s of c.specialities; track $index) {
        <span class="badge badge-xs bg-neutral text-neutral-content border-none scale-90">{{ s }}</span>
        }
      </div>

      <div class="flex items-center justify-center gap-1 text-[11px] mb-5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-orange-400 fill-current" viewBox="0 0 24 24">
          <path
            d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.869 1.4-8.168L.132 9.21l8.2-1.192z" />
        </svg>
        <span class="font-bold">{{c.avgRating}}</span>
        <span class="opacity-50">| 評論則數({{ c.reviewCount }})</span>
      </div>

      <div class="w-full bg-primary/10 rounded-lg py-1 px-2 border border-primary/20 mb-4">
        <div class="text-[9px] font-black text-primary uppercase tracking-tighter mb-0">! 最新開課 !</div>
        <div class="text-sm font-bold text-base-content line-clamp-1 leading-tight">
          {{ courseName() }}
        </div>
      </div>

      <div class="card-actions w-full justify-center mt-2">
        <button (click)="intro(c.coachId)" class="btn btn-primary btn-sm w-1/2 h-8 min-h-0 shadow-md">
          詳細資訊
        </button>
      </div>

    </div>
  </div>
  }
</div>
