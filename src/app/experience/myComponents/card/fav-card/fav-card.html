<div data-theme="bumblebee" class="p-8 flex justify-center bg-base-200">

  <div class="card w-72 bg-base-100 shadow-xl border border-base-300 relative mt-16">

    <div class="absolute -top-16 left-1/2 -translate-x-1/2">
      <div class="avatar">
        <div class="w-32 h-32 rounded-full border-4 border-base-100 shadow-lg ring ring-primary ring-offset-2">
          <img src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.webp" alt="教練頭像" />
        </div>
      </div>
    </div>

    <div class="card-body items-center text-center pt-20">

      <h2 class="card-title text-xl font-bold">Daisy 老師</h2>
      <div class="text-sm text-base-content/60 space-y-1">
        <p>📍 台北市大安區</p>
        <p>💪 體態雕塑 / 核心強化</p>
      </div>

      <div class="mt-4 flex flex-col items-center gap-1">
        <div class="rating rating-sm">
          <input *ngFor="let s of [1,2,3,4,5]" type="radio" class="mask mask-star-2 bg-orange-400" [checked]="s === 5"
            disabled />
        </div>
        <span class="text-xs font-medium text-base-content/50">
          5.0 ({{ 128 }} 則評論)
        </span>
      </div>

      <div class="alert alert-sm bg-base-200 border-none mt-4 py-2">
        <span class="text-xs font-bold text-secondary">最近開課：晨間伸展營</span>
      </div>

      <div class="card-actions flex flex-col w-full gap-2 mt-6">
        <button class="btn btn-primary btn-outline btn-sm w-full gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
          回顧我的學習紀錄
        </button>

        <button class="btn btn-ghost btn-xs text-error/60 hover:text-error">
          取消收藏
        </button>
      </div>

    </div>
  </div>
</div>
