@if (coachItem(); as c) {
<div class="card w-72 h-[500px] bg-base-100 shadow-xl border border-base-300 relative mt-16 flex-shrink-0">

  <div class="absolute -top-16 left-1/2 -translate-x-1/2">
    <div class="avatar">
      <div class="w-32 h-32 rounded-full border-4 border-base-100 shadow-lg ring ring-primary ring-offset-2">
        <img [src]="c.avatarUrl | avatar" alt="教練頭像" class="bg-base-200" />
      </div>
    </div>
  </div>

  <div class="card-body items-center text-center pt-20 pb-6 flex flex-col justify-between">
    <div class="w-full">
      <div class="flex items-center justify-center gap-2 mb-2">
        <h2 class="card-title text-xl font-bold">{{ c.coachName }}</h2>
        <label class="swap swap-rotate hover:scale-110 transition-transform cursor-pointer">
          <input type="checkbox" (change)="toggleFav()" [checked]="isFav()" />
          <svg xmlns="http://www.w3.org/2000/svg" class="swap-on fill-error w-7 h-7" viewBox="0 0 24 24">
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" class="swap-off fill-base-content/20 w-7 h-7" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
        </label>
      </div>

      <div class="flex flex-wrap justify-center gap-1 mb-3">
        @for(d of c.district; track $index) {
        <span class="badge badge-sm badge-ghost opacity-70">📍 {{ d }}</span>
        }
      </div>
      <div class="flex flex-wrap justify-center gap-1 mb-3">
        @for(s of c.specialities; track $index) {
        <span class="badge badge-sm bg-neutral text-neutral-content border-none">{{ s }}</span>
        }
      </div>

      <div class="flex items-center justify-center gap-1 text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-orange-400 fill-current" viewBox="0 0 24 24">
          <path
            d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.869 1.4-8.168L.132 9.21l8.2-1.192z" />
        </svg>
        <span class="font-bold">{{c.avgRating}}</span>
        <span class="text-base-content/50">({{ c.reviewCount }} 則評論)</span>
      </div>
    </div>

    <div class="w-full bg-primary/10 rounded-xl p-3 my-2 border border-primary/20">
      <div class="text-xs font-bold text-primary uppercase tracking-wider">!最新開課!</div>
      <div class="stat-value text-2xl">{{ courseName() }}</div>
    </div>

    <div class="card-actions w-full">
      <button (click)="intro()" class="btn btn-primary btn-sm w-full shadow-md hover:scale-105 transition-all">
        查看詳細資訊
      </button>
    </div>
  </div>
</div>
}
