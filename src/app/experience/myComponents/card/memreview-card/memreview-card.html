<div class="flex flex-col gap-3">
  <div class="flex items-center gap-4">
    <span class="font-black text-lg text-base-content">{{ data.userId }}</span>
    <div class="flex items-center gap-1 bg-warning/20 px-2 py-0.5 rounded-full">
      <span class="text-sm font-bold text-warning-content">{{data.rating}}</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-4 h-4 fill-warning">
        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
      </svg>
    </div>
  </div>

  <p class="text-base-content/80 text-sm leading-relaxed line-clamp-3 min-h-[3em]">
    {{ data.ReviewContent }}
  </p>

  <div class="text-right">
    <span class="text-xs opacity-40">{{ data.ReviewedAt }}</span>
  </div>
</div>
