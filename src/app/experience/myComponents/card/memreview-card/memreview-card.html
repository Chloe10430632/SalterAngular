<div data-theme="bumblebee" class="card card-side bg-base-100 border border-base-200 p-4 shadow-sm gap-4">

  <div class="avatar">
    <div class="w-10 h-10 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
      <img [src]="data.coachInfo?.avatarUrl|avatar" [alt]="data.userName + ' 的頭像'" />
    </div>
  </div>
  <div class="flex-1 min-w-0">
    <div class="flex items-center flex-wrap gap-x-3 gap-y-1 mb-1.5">
      <span class="font-bold text-sm truncate">{{ data.userName }}</span>

      <div class="rating rating-xs gap-0.5">
        @for (s of [1, 2, 3, 4, 5]; track $index) {
        <input type="radio" class="mask mask-star-2 bg-orange-400" [checked]="$index + 1 <= data.rating" disabled />
        }
      </div>

      <span class="text-xs text-base-content/50 ml-auto flex-shrink-0">
        {{ data.reviewedAt | date:'yyyy-MM-dd' }}
      </span>
    </div>

    <p class="text-sm text-base-content/70 leading-relaxed break-words">
      {{ data.reviewContent }}
    </p>
  </div>
</div>
