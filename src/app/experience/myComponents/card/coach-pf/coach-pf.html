<div
  class="w-full max-w-4xl mx-auto bg-base-100 rounded-3xl border-2 border-primary shadow-lg overflow-hidden transition-all hover:shadow-2xl"
  data-theme="bumblebee">

  <div class="p-8 md:p-12">

    <div class="grid grid-cols-1 md:grid-cols-3 gap-10">

      <div class="flex flex-col items-center text-center">
        <div class="avatar mb-4">
          <div class="w-32 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2 shadow-sm">
            <img [src]=" data?.avatarUrl" alt="Avatar" />
          </div>
        </div>
        <h1 class="text-2xl font-black text-[#8B4513]">{{ data?.coachName }}</h1>

        <div class="flex flex-wrap justify-center gap-2 mt-4">
          @for (tag of data?.specialities; track tag) {
          <span class="badge badge-primary font-bold py-3 px-4">{{ tag }}</span>
          }
        </div>
      </div>

      <div class="md:col-span-2 space-y-6">

        <div>
          <div class="divider divider-start font-black text-primary text-lg opacity-80 mt-0">關於我</div>
          <div class="px-2">
            <p class="text-base-content/80 leading-loose text-lg text-justify whitespace-pre-line">
              {{ data?.introduction }}
            </p>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">

          <div class="bg-base-200/30 p-4 rounded-2xl border border-base-200">
            <div class="flex items-center gap-2 mb-2">
              <span class="text-primary font-black text-lg">✦ 專業領域 ✦</span>
            </div>
            <div class="flex flex-wrap gap-2">
              @for (tag of data?.specialities; track tag) {
              <span class="badge badge-ghost font-bold">{{ tag }}</span>
              } @empty {
              <span class="text-base-content/40 text-sm">尚無專業資料</span>
              }
            </div>
          </div>

          <div class="bg-base-200/30 p-4 rounded-2xl border border-base-200">
            <div class="flex items-center gap-2 mb-2">
              <span class="text-primary font-black text-lg">✦ 服務地區 ✦</span>
            </div>
            @if(data){
            <div class="px-1">
              <p class="text-base-content font-bold text-lg">
                {{ data.district}}
              </p>
            </div>}
            @else {
            <span class="text-base-content/40 text-sm">尚無設定地區</span>
            }
          </div>

        </div>

      </div>

    </div>
