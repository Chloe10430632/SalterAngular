<div data-theme="bumblebee" class="p-4">
  @for (item of data(); track item.courseSessionId) {
  <div class="card card-side bg-base-100 shadow-xl mb-4 border border-base-300">
    <div class="p-6 flex flex-col justify-center">
      @if (!item.reviewContent) {
      <button class="btn"
        [ngClass]="{'btn-primary': canReview(item.startDate ?? ''), 'btn-ghost': !canReview(item.startDate ?? '')}"
        [disabled]="!canReview(item.startDate ?? '')" (click)="openReviewModal(item)">
        撰寫評價
      </button>
      } @else {
      <div class="text-center">
        <div class="text-2xl font-bold text-warning">{{item.rating}} ★</div>
        <button class="btn btn-xs btn-outline mt-2" (click)="openReviewModal(item)">修改/刪除</button>
      </div>
      }
    </div>
  </div>
  }

  <dialog id="review_modal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg text-primary">課程評論</h3>

      @if (selectedCourse(); as info) {
      <div class="bg-base-200 p-4 rounded-xl my-4">
        <p class="font-bold">{{ info.title }}</p>
        <p class="text-xs opacity-60">教練：{{ info.coachName }}</p>
      </div>
      }

      <div class="form-control mb-4">
        <label class="label"><span class="label-text font-bold">給個評價吧！</span></label>
        <div class="rating rating-lg">
          @for (s of [1,2,3,4,5]; track s) {
          <input type="radio" name="modal-rating" class="mask mask-star-2 bg-orange-400" [checked]="currentScore === s"
            (click)="setScore(s)" />
          }
        </div>
        <p class="text-xs mt-2 text-base-content/60">目前評分：{{ currentScore }} 分</p>
      </div>

      <textarea [(ngModel)]="reviewText" class="textarea textarea-bordered w-full h-24" placeholder="說點什麼吧...">
      </textarea>

      <div class="modal-action">
        <form method="dialog">
          <button class="btn btn-ghost">取消</button>
        </form>

        <button class="btn btn-primary" [disabled]="!reviewText.trim()" (click)="submitReview()">
          @if (selectedCourse()?.reviewContent) {
          確認修改
          } @else {
          送出評論
          }
        </button>
      </div>
    </div>
  </dialog>
</div>
