<!-- checkout.component.html -->
<div class="min-h-screen bg-slate-950 flex items-center justify-center px-4">

  <!-- Card -->
  <div class="w-full max-w-md bg-slate-900 border border-slate-700/50 rounded-2xl overflow-hidden shadow-2xl">

    <!-- Header -->
    <div class="px-8 pt-8 pb-6 border-b border-slate-700/50">
      <p class="text-xs font-medium tracking-[0.2em] text-slate-500 uppercase mb-2">安全結帳</p>
      <h1 class="text-2xl font-semibold text-white">確認付款</h1>
    </div>

    <!-- Order summary -->
    <div class="px-8 py-6 space-y-4">

      <!-- Item row -->
      <div class="flex items-start justify-between gap-4">
        <div class="flex-1">
          <p class="text-sm text-slate-400 mb-1">商品</p>
          <p class="text-white font-medium leading-snug">{{ itemName || '載入中...' }}</p>
        </div>
        <div class="text-right shrink-0">
          <p class="text-sm text-slate-400 mb-1">金額</p>
          <p class="text-white font-semibold text-lg">
            NT$ {{ amount | number }}
          </p>
        </div>
      </div>

      <!-- Divider -->
      <div class="border-t border-slate-700/50"></div>

      <!-- Total -->
      <div class="flex items-center justify-between">
        <span class="text-slate-300 text-sm font-medium">應付總計</span>
        <span class="text-emerald-400 text-xl font-bold">NT$ {{ amount | number }}</span>
      </div>
    </div>

    <!-- Error message -->
    <div *ngIf="errorMsg" class="mx-8 mb-4 px-4 py-3 bg-red-500/10 border border-red-500/30 rounded-lg">
      <p class="text-red-400 text-sm">{{ errorMsg }}</p>
    </div>

    <!-- Action area -->
    <div class="px-8 pb-8">
      <button (click)="checkout()" [disabled]="isLoading" class="w-full relative flex items-center justify-center gap-3
               bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98]
               disabled:opacity-60 disabled:cursor-not-allowed
               text-slate-950 font-semibold text-base
               py-4 rounded-xl transition-all duration-200 ease-out
               shadow-lg shadow-emerald-500/20">

        <!-- Spinner -->
        <svg *ngIf="isLoading" class="animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z" />
        </svg>

        <!-- Lock icon -->
        <svg *ngIf="!isLoading" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0110 0v4" />
        </svg>

        <span>{{ isLoading ? '處理中...' : '前往綠界付款' }}</span>
      </button>

      <!-- Security note -->
      <p class="mt-4 text-center text-xs text-slate-600">
        由綠界科技提供安全金流加密保護
      </p>
    </div>
  </div>
</div>
