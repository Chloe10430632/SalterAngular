<div class="hero min-h-screen bg-base-200 overflow-hidden relative">

  <div class="absolute inset-0 opacity-8 pointer-events-none">
    <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="waves" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M0 50 Q 25 25 50 50 T 100 50" fill="none" stroke="#00bafe" stroke-width="4" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#waves)" />
    </svg>
  </div>

  <div class="hero-content text-center text-primary-content z-10">
    <div class="max-w-md group">

      <div class="relative mx-auto mb-8 w-48 h-48 transition-transform duration-700 group-hover:scale-100">
        <div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full group-hover:bg-primary/40 transition-colors">
        </div>

        <img src="notfound.gif" alt="Lost in Island"
          class="relative z-10 w-full h-full object-contain mask mask-squircle" />
      </div>

      <h1 class="text-6xl font-black tracking-tighter transition-all duration-500 group-hover:tracking-widest">
        迷路了嗎?
      </h1>

      <p class="py-8 text-lg font-medium opacity-60 leading-relaxed transition-opacity group-hover:opacity-100">
        你來到了無人的荒島，請尋找回岸上的路吧！
      </p>

      <div class="flex flex-col gap-3 items-center">
        <a href="/" class="btn btn-neutral btn-wide rounded-full text-lg shadow-xl
                  hover:shadow-primary/20 hover:-translate-y-1.5
                  active:scale-95 transition-all duration-300">
          帶我回岸上
        </a>
      </div>
    </div>
  </div>
</div>
