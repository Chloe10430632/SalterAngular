<div class="container mx-auto p-6">
  <h2 class="text-xl font-bold mb-4">📍 {{ currentCity }} 的房源推薦</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (house of results; track house.houseId) {
    <div [routerLink]="['/houseDetail', house.roomTypeId]"
      class="card bg-base-100 shadow-xl hover:shadow-2xl transition-all cursor-pointer">
      <figure class="h-48 overflow-hidden">
        <img [src]="houseService.getCloudinaryThumb(house.imageUrl)" class="object-cover w-full h-full" />
      </figure>
      <div class="card-body p-4">
        <h3 class="card-title text-base">{{ house.title }}</h3>
        <p class="text-sm text-gray-500">{{ house.roomTypeName }}</p>
        <div class="card-actions justify-end mt-2">
          <span class="text-primary font-bold text-lg">${{ house.price | number }}</span>
          <span class="text-xs text-gray-400 self-end mb-1">/ 晚</span>
        </div>
      </div>
    </div>
    }
  </div>

  @if (results.length === 0) {
  <div class="text-center py-20 bg-base-200 rounded-3xl mt-10">
    <i class="bi bi-house-exclamation text-5xl text-gray-400"></i>
    <p class="mt-4 text-gray-500">這個城市暫時還沒有房源喔，去看看其他地方吧！</p>
  </div>
  }
</div>
