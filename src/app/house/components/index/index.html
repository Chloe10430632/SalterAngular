<div class="mb-8">
  <h1 class="text-2xl font-bold text-base-content">探索房源</h1>
  <p class="text-gray-500">找到最適合你的休憩之地</p>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
  <div *ngFor="let item of properties" class="group cursor-pointer">
    <div class="relative aspect-square overflow-hidden rounded-2xl shadow-sm">
      <img [src]="item.img"
        class="object-cover w-full h-full transition-transform duration-500 group-hover:scale-110" />
      <button class="btn btn-ghost btn-circle btn-sm absolute top-3 right-3 text-white/90">
        <i class="bi bi-heart text-xl"></i>
      </button>
    </div>

    <div class="mt-3">
      <div class="flex justify-between items-start">
        <h3 class="font-bold text-base-content">{{ item.location }}</h3>
        <div class="flex items-center gap-1">
          <i class="bi bi-star-fill text-xs text-warning"></i>
          <span class="text-sm font-medium">{{ item.rating }}</span>
        </div>
      </div>
      <p class="text-gray-500 text-sm truncate">{{ item.name }}</p>
      <p class="mt-1 font-semibold text-base-content">
        ${{ item.price | number }} <span class="font-normal">晚</span>
      </p>
    </div>
  </div>
</div>
