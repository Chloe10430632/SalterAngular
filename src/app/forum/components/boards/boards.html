<div class="col-span-12 md:col-span-6 space-y-4">
  <div class="bg-base-100 border border-base-300 rounded-xl overflow-hidden lg:min-h-screen">


    <div class="card bg-base-100 rounded-xl overflow-hidden mb-4 transition-all duration-300">
      <div class="card-body p-4">
        <!-- 抽換區:看板列表結構 -->


        <div class="boards">
          <div class="p-4 border-b border-base-200 bg-base-200/20 flex justify-between items-center">
            @if(!this.queryPara){
            <h3 class="font-black text-md tracking-wider opacity-70">所有看板</h3>
            }

            @if(this.queryPara === 'popular'){
            <h3 class="font-black text-md tracking-wider opacity-70">熱門看板</h3>
            }

            @if (this.queryPara === 'follow'){
            <h3 class="font-black text-md tracking-wider opacity-70">追蹤推薦看板</h3>
            }


          </div>

          <div class="divide-y divide-gray-300">

            @if(boardList.length === 0) {
            @for (i of [1,2,3,4,5]; track i) {
            <div class="flex items-center gap-4 p-4">
              <div class="skeleton w-4 h-4 rounded opacity-50"></div>

              <div class="avatar">
                <div class="skeleton w-10 h-10 rounded mr-5 shrink-0"></div>
              </div>

              <div class="flex-1">
                <div class="skeleton h-5 w-3/4 rounded"></div>
              </div>

              <div class="skeleton w-16 h-8 rounded-full shrink-0"></div>
            </div>
            }
            }@else {
            @for (board of boardList; track board.boardId) {

            <a class="flex items-center gap-4 p-4 hover:bg-base-200/30 transition-colors group cursor-pointer"
              [routerLink]="'/forum/boards/'+board.boardId">
              <span class="w-4 text-center font-black text-error text-sm">{{$index+1}}</span>
              <div class="avatar">
                <div class="w-10 h-10 rounded mr-5">
                  <img [src]="board.boardImgUrl" />
                </div>
              </div>
              <div class="flex-1">
                <div class="font-bold text-base group-hover:text-primary transition-colors">
                  {{board.boardTitle}}
                </div>
              </div>
              <button class="btn btn-neutral btn-outline btn-sm rounded-full px-5 hover:!text-white">追蹤</button>
            </a>

            }

            }







          </div>
        </div>





      </div>
    </div>



  </div>
</div>
