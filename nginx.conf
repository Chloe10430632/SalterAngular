server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # 關鍵：如果找不到檔案，就導向 index.html
        try_files $uri $uri/ /index.html;
    }

    # 發生錯誤時的處理
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
